<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Утилита 2</title>
    <script>
      (function () {
        var t = localStorage.getItem('xml-gen-theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      })();
    </script>
    <link rel="stylesheet" href="/tools/shared-tools-theme.css" />
  </head>
  <body>
    <h1>Утилита 2 — заглушка</h1>
    <p>
      Замените этот файл (<code>frontend/public/tools/util2.html</code>) своим настоящим HTML-файлом
      утилиты. Оставьте в <code>&lt;head&gt;</code> ссылку на
      <code>/tools/shared-tools-theme.css</code>, чтобы стили автоматически совпадали с основным приложением.
    </p>
    <p><a href="/">&larr; Назад в приложение</a></p>
  </body>
</html>
